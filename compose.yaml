name: incident-prototype

services:
  backend:
    build:
      context: ./services/backend
      dockerfile: ../Dockerfile
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - incident-net
    restart: "no"

  upstream:
    build:
      context: ./services/upstream
      dockerfile: ../Dockerfile
    environment:
      PORT: "8080"
      BACKEND_URL: "http://backend:8080/data"
      BACKEND_TIMEOUT: "2"
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - incident-net
    depends_on:
      - backend
    restart: "no"

networks:
  incident-net:
    driver: bridge
